<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akina — проверка горного окружения</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1a20;color:#e5ddbe;font:12px monospace}header{min-height:70px;display:flex;align-items:center;gap:10px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid #78663d}strong{margin-right:auto;color:#e1c17c;font-size:14px}button{font:11px monospace;background:#27352c;color:#e9e5ca;border:1px solid #576448;border-radius:3px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#d7b96e;color:#17221e;border-color:#efdaa0}canvas{display:block;width:100%;height:calc(100svh - 70px);min-height:480px}</style>
<script src="catalog.js?v=3.5.2" defer></script><script src="tuning-cards.js?v=3.5.2" defer></script><script src="tracks.js?v=3.5.2" defer></script><script src="engine.js?v=3.5.2" defer></script><script src="renderer.js?v=3.5.2" defer></script></head>
<body><header><strong>★ AKINA / MOUNTAIN REWORK</strong><button data-position="0" aria-pressed="true">СТАРТ</button><button data-position="0.1025">НИЖНЯЯ ШПИЛЬКА</button><button data-position="0.44375">СРЕДНИЙ СЕКТОР</button><button data-position="0.6925">ПЯТЬ ШПИЛЕК</button><button data-position="0.98">ВЕРШИНА</button><button id="overview" aria-pressed="false">ОБЗОР</button><button id="quality">КАЧЕСТВО: ВЫСОКОЕ</button></header><canvas aria-label="Горный серпантин Акины"></canvas>
<script>addEventListener('DOMContentLoaded',async()=>{const engine=new NDCore.Engine({trackId:'akina',carId:'s2000'}),renderer=new NDRenderer.Renderer(document.querySelector('canvas'));engine.rivals=[];engine.state='running';await NDRenderer.preloadSprites(NDCore.cars);let overview=false;function draw(){renderer.render(engine,0,{reducedMotion:true,overview});}for(const button of document.querySelectorAll('[data-position]'))button.addEventListener('click',()=>{overview=false;document.querySelector('#overview').setAttribute('aria-pressed','false');for(const other of document.querySelectorAll('[data-position]'))other.setAttribute('aria-pressed',String(other===button));Object.assign(engine.player,engine.track.points[Math.floor(Number(button.dataset.position)*(engine.track.points.length-1))],{speed:0});renderer.camera.ready=false;draw();});document.querySelector('#overview').addEventListener('click',event=>{overview=!overview;event.target.setAttribute('aria-pressed',String(overview));draw();});document.querySelector('#quality').addEventListener('click',event=>{renderer.setQuality(renderer.quality==='high'?'low':'high');event.target.textContent='КАЧЕСТВО: '+(renderer.quality==='high'?'ВЫСОКОЕ':'НИЗКОЕ');draw();});addEventListener('resize',draw);draw();});</script></body></html>
