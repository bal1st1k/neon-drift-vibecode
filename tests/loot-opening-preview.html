<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Открытие кейсов — QA</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../autumn.css"><link rel="stylesheet" href="../loot-opening.css">
<script src="../catalog.js" defer></script><script src="../tuning-cards.js" defer></script><script src="../tracks.js" defer></script><script src="../traffic.js" defer></script><script src="../engine.js" defer></script><script src="../shop.js" defer></script><script src="../radio.js" defer></script><script src="../progress.js" defer></script><script src="../loot.js" defer></script><script src="../garage.js" defer></script>
<style>#menu-shell{padding:30px;min-height:100vh}#menu-shell h1{font-size:30px;margin-bottom:20px}.qa-actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.qa-note{max-width:650px;line-height:1.8;color:#bcaa8e}</style></head><body>
<div id="menu-shell"><h1>Открытие кейсов / QA</h1><p class="qa-note">Предпросмотр реального интерфейса раскрытия. Только порт 4181 может подготовить отдельное тестовое сохранение.</p><div class="qa-actions"><button class="button button-lime" data-preview="parts">Детали</button><button class="button button-lime" data-preview="currency">Валюта</button><button class="button button-lime" data-preview="car">Машина</button><button class="button button-lime" data-preview="batch">10 кейсов</button></div><label><input type="checkbox" id="qa-motion"> Меньше движения</label><div class="qa-actions"><button class="button button-outline" id="qa-seed">Подготовить 20 кейсов в игре</button><a class="button button-outline" href="../index.html">Открыть игру</a></div><p id="qa-status"></p></div>
<div id="modal-backdrop" class="modal-backdrop" hidden><section class="modal loot-modal" id="modal-loot" role="dialog" aria-modal="true" aria-labelledby="loot-title" hidden><button class="modal-close icon-button" data-action="close-modal" aria-label="Закрыть">×</button><span class="eyebrow" id="loot-eyebrow"></span><h2 id="loot-title"></h2><div id="loot-progress" class="loot-progress"></div><div id="loot-stage" class="loot-stage" hidden></div><div id="loot-reveal-grid" class="loot-reveal-grid" aria-live="polite"></div><button class="button button-lime full-width loot-next" id="loot-next" data-action="next-loot"></button><p id="loot-caption"></p><button class="button button-lime full-width" data-action="inventory">В ИНВЕНТАРЬ</button></section></div>
<script>addEventListener('DOMContentLoaded',()=>{
 const save=NDProgress.defaults(),ui=Object.create(NDUX.Interface.prototype);ui.getSave=()=>save;ui.onReveal=()=>{};ui.reveal=null;ui.revealTimer=null;
 const samples={parts:[{type:'card',cardId:'turbo-blue'}],currency:[{type:'currency',amount:1500}],car:[{type:'car',carId:'na6ce'}],batch:Array.from({length:20},(_,i)=>i===7?{type:'car',carId:'na6ce'}:i%5===0?{type:'currency',amount:800}:{type:'card',cardId:i%3===0?'tires-yellow':'turbo-blue'})};
 const caseGroups=Array.from({length:10},(_,i)=>samples.batch.slice(i*2,i*2+2));
 document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;
  if(button.dataset.preview){ui.renderReveal(samples[button.dataset.preview],'case','roadster',button.dataset.preview==='batch'?10:1,button.dataset.preview==='batch'?caseGroups:undefined);document.querySelector('#modal-backdrop').hidden=false;document.querySelector('#modal-loot').hidden=false;document.querySelector('#menu-shell').inert=true;document.querySelector('#loot-open-case').focus();}
  if(['next-loot','unseal-case'].includes(button.dataset.action))ui.advanceReveal();
  if(['close-modal','inventory'].includes(button.dataset.action)){ui.cancelReveal();document.querySelector('#modal-backdrop').hidden=true;document.querySelector('#modal-loot').hidden=true;document.querySelector('#menu-shell').inert=false;}
 });
 document.querySelector('#qa-motion').onchange=event=>{save.settings.reducedMotion=event.target.checked;document.body.classList.toggle('reduce-motion',event.target.checked);};
 document.querySelector('#qa-seed').onclick=()=>{if(location.port!=='4181')return;const s=NDProgress.defaults();s.credits=100000;for(const id of Object.keys(s.inventory.cases))s.inventory.cases[id]=20;s.pity.roadster=29;s.settings={...s.settings,sound:false,music:false,radio:false,reducedMotion:false};localStorage.setItem('neon-drift.garage.v1',JSON.stringify(s));document.querySelector('#qa-status').textContent='Готово: 20 кейсов каждого типа, следующий Roadster — гарант.';};
});</script></body></html>
