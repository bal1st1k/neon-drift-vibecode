<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ночные перевалы / QA</title>
<style>*{box-sizing:border-box}body{height:100svh;display:flex;flex-direction:column;margin:0;background:#233b2c;color:#ecebd7;font:12px monospace}header{display:flex;align-items:center;gap:9px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid #89976a}strong{margin-right:auto;color:#d4dfa4;font-size:14px}button{font:11px monospace;background:#3e5740;color:#f0efd7;border:1px solid #88996f;border-radius:3px;padding:10px;cursor:pointer}button[aria-pressed=true]{background:#c5d78d;color:#233b2c}canvas{display:block;width:100%;height:0;flex:1;min-height:0}#status{font-size:10px}</style>
<script src="catalog.js?v=4.0.2" defer></script><script src="tuning-cards.js" defer></script><script src="tracks.js?v=4.0.2" defer></script><script src="engine.js" defer></script><script src="renderer.js?v=4.0.2" defer></script></head>
<body><header><strong>AKAGI / ENNA SKYLINE · NIGHT QA</strong><button data-position="0" aria-pressed="true">СТАРТ</button><button data-position=".25">25%</button><button data-position=".50">50%</button><button data-position=".75">75%</button><button data-position=".95">95%</button><button id="overview" aria-pressed="false">ОБЗОР</button><button id="quality">КАЧЕСТВО: ВЫСОКОЕ</button><button id="drive" aria-pressed="false">АВТОПИЛОТ</button><span id="status"></span></header><canvas aria-label="Ночной горный перевал"></canvas>
<script>addEventListener('DOMContentLoaded',async()=>{
const engine=new NDCore.Engine({trackId:new URLSearchParams(location.search).get('track')==='enna-skyline'?'enna-skyline':'akagi',carId:'s15'}),renderer=new NDRenderer.Renderer(document.querySelector('canvas'));engine.rivals=[];engine.state='running';await NDRenderer.preloadSprites(NDCore.cars);
let overview=false,drive=false,frames=0,previous=0;const errors=[];addEventListener('error',e=>errors.push(e.message));
for(const button of document.querySelectorAll('[data-position]'))button.addEventListener('click',()=>{overview=false;drive=false;document.querySelector('#overview').setAttribute('aria-pressed','false');document.querySelector('#drive').setAttribute('aria-pressed','false');for(const other of document.querySelectorAll('[data-position]'))other.setAttribute('aria-pressed',String(other===button));const i=Math.floor(Number(button.dataset.position)*(engine.track.points.length-1)),p=engine.track.points[i];Object.assign(engine.player,p,{speed:0,vx:0,vy:0});engine._nearest={...p,index:i,offset:0,separation:0,t:0};renderer.camera.ready=false;});
document.querySelector('#overview').addEventListener('click',e=>{overview=!overview;e.target.setAttribute('aria-pressed',String(overview));});
document.querySelector('#quality').addEventListener('click',e=>{renderer.setQuality(renderer.quality==='high'?'low':'high');e.target.textContent='КАЧЕСТВО: '+(renderer.quality==='high'?'ВЫСОКОЕ':'НИЗКОЕ');});
document.querySelector('#drive').addEventListener('click',e=>{drive=!drive;e.target.setAttribute('aria-pressed',String(drive));});
function frame(now){const dt=Math.min(.035,(now-previous)/1000||.016);previous=now;if(drive)engine.update(dt,engine.getAutopilotInput());renderer.render(engine,drive?dt:0,{overview,reducedMotion:!drive});if(frames++%30===0)document.querySelector('#status').textContent='Worker: '+(renderer.highwayWorkerReady?'готов':renderer.highwayWorker?'запуск':'idle')+' / кэш '+renderer.sceneryTiles.size+' / ошибок '+errors.length;requestAnimationFrame(frame);}requestAnimationFrame(frame);
});</script></body></html>
