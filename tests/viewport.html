<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neon Drift — проверка экрана</title><style>*{box-sizing:border-box}body{margin:0;background:#1c2228;color:#e6eddf;font:14px 'Segoe UI',sans-serif;padding:30px}header{display:flex;align-items:center;gap:20px;margin-bottom:25px}button{background:#d4ff42;border:0;border-radius:4px;padding:10px 14px;cursor:pointer;font:12px monospace}main{display:flex;justify-content:center}iframe{border:1px solid #68756b;width:360px;height:800px;background:#0c1013;box-shadow:0 10px 45px #0006}h1{font-size:18px;font-weight:500;margin:0}span{color:#94a49a;font-size:12px}</style></head><body><header><h1>NEON DRIFT / VIEWPORT QA</h1><button data-width="320">320</button><button data-width="360">360</button><button data-width="768">768</button><button data-width="1280">1280</button><span id="size">360 × 800</span></header><main><iframe src="../index.html" title="Мобильный предпросмотр Neon Drift"></iframe></main><script>for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{const frame=document.querySelector('iframe');frame.style.width=button.dataset.width+'px';document.querySelector('#size').textContent=button.dataset.width+' × 800';});</script></body></html>
