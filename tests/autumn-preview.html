<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Осенний интерфейс — QA</title><style>body{background:#211910;color:#f3d8a3;font:16px system-ui;padding:35px;max-width:750px}button,a{display:inline-block;margin:12px;padding:16px;background:#e9ba56;color:#21180b;border:0;cursor:pointer;text-decoration:none}p{line-height:1.8}</style><script src="../catalog.js" defer></script><script src="../tuning-cards.js" defer></script><script src="../tracks.js" defer></script><script src="../traffic.js" defer></script><script src="../engine.js" defer></script><script src="../shop.js" defer></script><script src="../radio.js" defer></script><script src="../progress.js" defer></script></head><body><h1>Осенний интерфейс</h1><p>Отдельный QA-гараж на порту 4181: коллекция машин, карточки, кейсы и включённая анимация. Звук и радио выключены. Основной гараж на порту 4177 не затрагивается.</p><button id="prepare">Подготовить предпросмотр</button><p id="status"></p><a href="../index.html">Открыть игру</a><script>addEventListener('DOMContentLoaded',()=>{document.querySelector('#prepare').onclick=()=>{if(location.port!=='4181'){document.querySelector('#status').textContent='Используй QA-порт 4181.';return;}const save=NDProgress.defaults();save.credits=120000;save.owned=NDCatalog.cars.map(car=>car.id);save.selectedCar='jzx81';save.settings={...save.settings,sound:false,radio:false,music:false,reducedMotion:false};for(const id of Object.keys(save.inventory.cases))save.inventory.cases[id]=2;for(const card of NDCards.cards)save.inventory.cards[card.id]=2;localStorage.setItem('neon-drift.garage.v1',JSON.stringify(save));document.querySelector('#status').textContent='Готово. Открой игру.';};});</script></body></html>
