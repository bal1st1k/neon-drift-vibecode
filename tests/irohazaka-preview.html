<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irohazaka — проверка горного окружения</title>
<style>*{box-sizing:border-box}body{height:100svh;display:flex;flex-direction:column;margin:0;background:#0d1a20;color:#e5ddbe;font:12px monospace}header{min-height:70px;display:flex;align-items:center;gap:10px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid #78663d}strong{margin-right:auto;color:#e1c17c;font-size:14px}button{font:11px monospace;background:#27352c;color:#e9e5ca;border:1px solid #576448;border-radius:3px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#d7b96e;color:#17221e;border-color:#efdaa0}canvas{display:block;width:100%;height:0;flex:1;min-height:0}</style>
<script src="catalog.js?v=3.7.1" defer></script><script src="tuning-cards.js?v=3.7.1" defer></script><script src="tracks.js?v=3.7.1" defer></script><script src="engine.js?v=3.7.1" defer></script><script src="renderer.js?v=3.7.1" defer></script></head>
<body><header><strong>★ IROHAZAKA / AUTUMN / DEEP NIGHT</strong><button data-position="0" aria-pressed="true">СТАРТ</button><button data-position="0.19">ПЕРВЫЕ ШПИЛЬКИ</button><button data-position="0.43">СРЕДНИЙ СЕКТОР</button><button data-position="0.68">ЛЕСНОЙ КАСКАД</button><button data-position="0.98">ФИНИШ</button><button id="overview" aria-pressed="false">ОБЗОР</button><button id="quality">КАЧЕСТВО: ВЫСОКОЕ</button><span id="status" aria-live="off"></span></header><canvas aria-label="Ночная осенняя Ирохазака"></canvas>
<script>addEventListener('DOMContentLoaded',async()=>{const engine=new NDCore.Engine({trackId:'irohazaka',carId:'s2000'}),renderer=new NDRenderer.Renderer(document.querySelector('canvas'));engine.rivals=[];engine.state='running';await NDRenderer.preloadSprites(NDCore.cars);let overview=false;function draw(){renderer.render(engine,0,{reducedMotion:true,overview});}for(const button of document.querySelectorAll('[data-position]'))button.addEventListener('click',()=>{overview=false;document.querySelector('#overview').setAttribute('aria-pressed','false');for(const other of document.querySelectorAll('[data-position]'))other.setAttribute('aria-pressed',String(other===button));Object.assign(engine.player,engine.track.points[Math.floor(Number(button.dataset.position)*(engine.track.points.length-1))],{speed:0});renderer.camera.ready=false;draw();});document.querySelector('#overview').addEventListener('click',event=>{overview=!overview;event.target.setAttribute('aria-pressed',String(overview));draw();});document.querySelector('#quality').addEventListener('click',event=>{renderer.setQuality(renderer.quality==='high'?'low':'high');event.target.textContent='КАЧЕСТВО: '+(renderer.quality==='high'?'ВЫСОКОЕ':'НИЗКОЕ');draw();});addEventListener('resize',draw);let frames=0;function frame(){draw();if(frames++%30===0)document.querySelector("#status").textContent="Worker: "+(renderer.highwayWorkerReady?"готов":renderer.highwayWorker?"запуск":"фоновая очередь")+" / кэш: "+renderer.sceneryTiles.size+" / очередь: "+renderer.sceneryTileQueue.length;requestAnimationFrame(frame);}requestAnimationFrame(frame);});</script></body></html>
