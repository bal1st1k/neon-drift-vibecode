<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Гарант — изолированная проверка</title><style>body{background:#121a20;color:#e0d6b6;font:16px system-ui;padding:35px;max-width:800px}button,a{display:inline-block;margin:12px;padding:16px;background:#d6b873;color:#161c20;border:0;cursor:pointer;text-decoration:none}p{line-height:1.8}</style><script src="../catalog.js" defer></script><script src="../tuning-cards.js" defer></script><script src="../tracks.js" defer></script><script src="../traffic.js" defer></script><script src="../engine.js" defer></script><script src="../shop.js" defer></script><script src="../progress.js" defer></script></head><body><h1>Проверка гаранта</h1><p>Эта страница работает только на отдельном QA-порту 4181. Подготавливает тестовый гараж: 29/30 у каждого специального кейса, по 3 кейса и 100 000 монет. Основной гараж на порту 4177 не затрагивается.</p><button id="fresh">Без машин гаранта</button><button id="duplicates">Все Toyota уже получены</button><p id="status"></p><a href="../index.html">Открыть игру</a><script>addEventListener('DOMContentLoaded',()=>{for(const button of document.querySelectorAll('button'))button.onclick=()=>{if(location.port!=='4181'){document.querySelector('#status').textContent='Используй QA-порт 4181.';return;}const save=NDProgress.defaults();save.credits=100000;save.settings={...save.settings,sound:false,music:false,reducedMotion:true};for(const id of Object.keys(NDShop.specialCases)){save.pity[id]=29;save.inventory.cases[id]=3;}if(button.id==='duplicates')save.owned.push(...NDShop.pityCars);localStorage.setItem('neon-drift.garage.v1',JSON.stringify(save));document.querySelector('#status').textContent='Тестовый гараж подготовлен. Можно открыть игру.';};});</script></body></html>
