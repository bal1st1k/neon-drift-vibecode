<!doctype html><html lang="ru"><head><meta charset="utf-8"><base href="../"><title>Wangan — проверка кэша на скорости</title><style>body{margin:0;background:#101b23;color:#dce7d3;font:14px monospace}header{padding:12px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}button{padding:8px;background:#25464c;color:#e1efdc;border:1px solid #6e9693}canvas{width:100%;height:calc(100vh - 90px);display:block}#status{line-height:1.5;white-space:pre-wrap}</style><script src="catalog.js" defer></script><script src="tuning-cards.js" defer></script><script src="tracks.js" defer></script><script src="traffic.js" defer></script><script src="engine.js" defer></script><script src="renderer.js" defer></script></head><body><header><strong>WANGAN / 650 ЕД. СКОРОСТИ</strong><button id="east">EAST</button><button id="west">WEST</button><span id="status">Подготовка…</span></header><canvas aria-label="Скоростной просмотр Wangan"></canvas><script>
addEventListener('DOMContentLoaded',async()=>{
const canvas=document.querySelector('canvas'),renderer=new NDRenderer.Renderer(canvas),samples=[];let engine,distance=0,last=0,frames=0,missFrames=0;
async function load(id){engine=new NDCore.Engine({trackId:id,carId:'s15'});engine.state='running';distance=engine.track.length*.08;renderer.camera.ready=false;frames=0;samples.length=0;missFrames=0;await NDRenderer.preloadSprites([engine.player,...engine.rivals,...engine.traffic]);}
document.querySelector('#east').onclick=()=>load('wangan-east');document.querySelector('#west').onclick=()=>load('wangan-west');await load('wangan-east');
function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;distance+=650*dt;if(distance>engine.track.length*.95)distance=engine.track.length*.08;
const index=Math.min(engine.track.points.length-1,Math.floor(distance/engine.track.length*(engine.track.points.length-1))),point=engine.track.points[index];Object.assign(engine.player,point,{vx:Math.cos(point.angle)*650,vy:Math.sin(point.angle)*650,speed:650});engine._nearest={...point,index};engine._updateTraffic(dt);
const before=performance.now();renderer.render(engine,dt,{reducedMotion:true});const elapsed=performance.now()-before;if(frames++>10)samples.push(elapsed);if(samples.length>600)samples.shift();
if(frames%15===0){const sorted=samples.slice().sort((a,b)=>a-b);document.querySelector('#status').textContent=engine.track.name+' | Worker: '+(renderer.highwayWorkerReady?'готов':renderer.highwayWorker?'запуск':'idle fallback')+' | Участки: '+renderer.sceneryTiles.size+' | Очередь: '+renderer.sceneryTileQueue.length+'\nОтрисовка, мс: среднее '+(samples.reduce((a,b)=>a+b,0)/Math.max(1,samples.length)).toFixed(2)+' | p95 '+(sorted[Math.floor(sorted.length*.95)]||0).toFixed(2)+' | максимум '+(sorted.at(-1)||0).toFixed(2);}
requestAnimationFrame(frame);}requestAnimationFrame(frame);
});</script></body></html>
