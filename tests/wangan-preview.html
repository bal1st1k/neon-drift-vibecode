<!doctype html><html lang="ru"><head><meta charset="utf-8"><base href="../"><title>Wangan — проверка шоссе и потока</title><style>body{margin:0;background:#101c22;color:#dbe9db;font:14px monospace}header{display:flex;gap:12px;align-items:center;padding:16px;flex-wrap:wrap}button,select{padding:10px;background:#2d4246;color:#eef5e2;border:1px solid #839981}canvas{width:100%;height:calc(100vh - 76px);display:block}</style><script src="catalog.js" defer></script><script src="tuning-cards.js" defer></script><script src="tracks.js" defer></script><script src="traffic.js" defer></script><script src="engine.js" defer></script><script src="renderer.js" defer></script></head><body><header><strong>WANGAN / ПОТОК</strong><select id="route" aria-label="Направление"><option value="wangan-east">Wangan East</option><option value="wangan-west">Wangan West</option></select><button data-sector="0">СТАРТ</button><button data-sector=".12">МОСТ / СЕКТОР 1</button><button data-sector=".64">ТОННЕЛЬ / СЕКТОР 3</button><button id="quality">КАЧЕСТВО</button><span id="status"></span></header><canvas aria-label="Шоссе Wangan с машинами потока"></canvas><script>
addEventListener('DOMContentLoaded',async()=>{let engine;const renderer=new NDRenderer.Renderer(document.querySelector('canvas'));async function load(){engine=new NDCore.Engine({trackId:document.querySelector('#route').value,carId:'s15'});engine.state='running';await NDRenderer.preloadSprites([engine.player,...engine.rivals,...engine.traffic]);renderer.camera.ready=false;}await load();document.querySelector('#route').onchange=load;document.querySelector('#quality').onclick=()=>renderer.setQuality(renderer.quality==='high'?'low':'high');for(const button of document.querySelectorAll('[data-sector]'))button.onclick=()=>{const index=Math.floor(Number(button.dataset.sector)*(engine.track.points.length-1)),point=engine.track.points[index];Object.assign(engine.player,point,{vx:0,vy:0,speed:0});engine._nearest={...point,index};engine._updateTraffic(.01);renderer.camera.ready=false;};let last=performance.now();function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;engine._updateTraffic(dt);renderer.render(engine,dt,{reducedMotion:true});document.querySelector('#status').textContent=engine.traffic.filter(t=>t.active).length+' МАШИН / '+renderer.sceneryTiles.size+' УЧАСТКОВ В КЭШЕ';requestAnimationFrame(frame);}requestAnimationFrame(frame);});
</script></body></html>
